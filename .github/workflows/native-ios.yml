name: Native iOS

on:
  push:
    paths:
      - 'ios-native/**'
      - 'plugins/epicenter-native-ios/ios/**'
      - '.github/workflows/native-ios.yml'
  pull_request:
    paths:
      - 'ios-native/**'
      - 'plugins/epicenter-native-ios/ios/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native regressions and simulator build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Native queue, tuning and Hi-Res analysis regressions
        run: |
          swiftc -swift-version 5 \
            plugins/epicenter-native-ios/ios/NativeAudio/NativeQueueManager.swift \
            plugins/epicenter-native-ios/ios/NativeAudio/NativeAutoAdjustment.swift \
            plugins/epicenter-native-ios/ios/NativeAudio/EpicenterAutoEQAnalyzer.swift \
            ios-native/Tests/NativeRegressionChecks.swift \
            -o "$RUNNER_TEMP/native-regressions"
          "$RUNNER_TEMP/native-regressions"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: DSP silence, bypass and sample-rate regressions
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I plugins/epicenter-native-ios/ios/DSP \
            plugins/epicenter-native-ios/ios/DSP/EpicenterDSPCore.cpp \
            ios-native/Tests/DSPRegressionChecks.cpp -o "$RUNNER_TEMP/dsp-regressions"
          "$RUNNER_TEMP/dsp-regressions"
      - name: Generate native project
        working-directory: ios-native
        run: |
          bash -n ../ABRIR_APP_NATIVA.command
          xcodegen generate
      - name: Compile SwiftUI app for iOS Simulator
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild -project EpicenterDSP.xcodeproj -scheme EpicenterDSP \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/epicenter-derived" \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/native-build.log"
      - name: Verify installed app version marker
        run: |
          app_plist="$RUNNER_TEMP/epicenter-derived/Build/Products/Debug-iphonesimulator/EpicenterDSP.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app_plist")" = '12.0.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app_plist")" = '21'
          test "$(/usr/libexec/PlistBuddy -c 'Print UIDeviceFamily:0' "$app_plist")" = '1'
          test "$(/usr/libexec/PlistBuddy -c 'Print UIDeviceFamily:1' "$app_plist")" = '2'
          test "$(/usr/libexec/PlistBuddy -c 'Print UISupportedInterfaceOrientations~ipad:3' "$app_plist")" = 'UIInterfaceOrientationLandscapeRight'
      - name: Boot iPhone Simulator
        timeout-minutes: 5
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,items in devices.items() if "iOS" in runtime for d in items if d["name"].startswith("iPhone")))')"
          echo "TEST_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device_id" -b
          open -a Simulator --args -CurrentDeviceUDID "$device_id"
      - name: Test Auto EQ on the playing track
        timeout-minutes: 8
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild -project EpicenterDSP.xcodeproj -scheme EpicenterDSP \
            -configuration Debug -destination "platform=iOS Simulator,id=$TEST_DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/epicenter-derived" \
            -parallel-testing-enabled NO -only-testing:EpicenterDSPTests \
            -resultBundlePath "$RUNNER_TEMP/auto-eq-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/auto-eq-tests.log"
      - name: Test tutorial button
        timeout-minutes: 6
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild -project EpicenterDSP.xcodeproj -scheme EpicenterDSP \
            -configuration Debug -destination "platform=iOS Simulator,id=$TEST_DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/epicenter-derived" \
            -parallel-testing-enabled NO -only-testing:EpicenterDSPUITests \
            -resultBundlePath "$RUNNER_TEMP/tutorial-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/tutorial-tests.log"
      - name: Build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: ${{ runner.temp }}/native-build.log
      - name: Simulator test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-simulator-tests
          path: |
            ${{ runner.temp }}/*-tests.log
            ${{ runner.temp }}/*-tests.xcresult
