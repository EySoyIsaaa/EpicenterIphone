name: EpicenterDSP
options:
  deploymentTarget:
    iOS: "15.6"
  createIntermediateGroups: true
  bundleIdPrefix: com.epicenterdsp

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: es
    # DEVELOPMENT_TEAM: XXXXXXXXXX   # opcional: pon tu Team ID o selecciona el equipo en Xcode

targets:
  EpicenterDSP:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epicenterdsp.player
        PRODUCT_NAME: EpicenterDSP
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"        # solo iPhone
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
