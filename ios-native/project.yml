name: EpicenterDSP
options:
  deploymentTarget:
    iOS: "15.6"
  createIntermediateGroups: true
  bundleIdPrefix: com.epicenterdsp

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: es
    # DEVELOPMENT_TEAM: XXXXXXXXXX   # opcional: pon tu Team ID o selecciona el equipo en Xcode

targets:
  EpicenterDSP:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Support/Assets.xcassets
      # Servicios nativos existentes (reutilizados, SIN el envoltorio de Capacitor).
      # Se referencian en su ubicación actual: una sola copia, sin duplicar.
      - path: ../plugins/epicenter-native-ios/ios/DSP
        name: Services/DSP
      - path: ../plugins/epicenter-native-ios/ios/NativeAudio
        name: Services/NativeAudio
      - path: ../plugins/epicenter-native-ios/ios/CarPlay
        name: Services/CarPlay
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: MediaPlayer.framework
      - sdk: Accelerate.framework
      - sdk: CarPlay.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.epicenterdsp.player
        PRODUCT_NAME: EpicenterDSP
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        SWIFT_OBJC_BRIDGING_HEADER: Support/Epicenter-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../plugins/epicenter-native-ios/ios/DSP
